version: 0.0
os: linux

hooks:
  ApplicationStop:
    - location: scripts/frontend_stop.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/frontend_pull.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: scripts/frontend_start.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/frontend_validate.sh
      timeout: 300
      runas: root
